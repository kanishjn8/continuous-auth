name: continuous-authentication

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-runtime
    environment:
      CA_DASHBOARD_SECRET: "${CA_DASHBOARD_SECRET:?Set CA_DASHBOARD_SECRET before starting Compose}"
      LOCALAPPDATA: /var/lib/continuous-authentication
    expose:
      - "8765"
    volumes:
      - runtime-data:/var/lib/continuous-authentication
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - application

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: dashboard-runtime
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CA_DASHBOARD_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - application
      - edge

networks:
  application:
    internal: true
  edge: {}

volumes:
  runtime-data:

