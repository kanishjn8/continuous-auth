[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "continuous-authentication-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "uvicorn[standard]>=0.30,<1",
]

[tool.setuptools]
packages = ["app"]


